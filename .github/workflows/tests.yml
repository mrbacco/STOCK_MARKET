name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # The same pinned, CPU-only dependency set as the Docker image.
      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      # The suite is offline: providers, collectors, and FinBERT are patched.
      - name: Run tests
        run: python -m unittest discover -s tests
